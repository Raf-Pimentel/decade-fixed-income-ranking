[project]
name = "ranking"
version = "0.1.0"
description = "Ranks Brazilian fixed-income funds by client profile, from CVM and ANBIMA public data."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "polars>=1.0",      # read and join the tables
    "numpy>=1.26",      # risk math and the robustness simulation
    "httpx>=0.27",      # downloads
    "tenacity>=8.2",    # retry with backoff
    "pandera[polars]>=0.20",  # declared table schemas
    "pydantic>=2.7",    # guarantees the shape of ranking.json
    "typer>=0.12",      # command line
    "pyyaml>=6.0",      # configuration files
]

[project.scripts]
ranking = "ranking.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ranking"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "trap: regression test for a known CVM data trap (see CLAUDE.md)",
    "invariant: financial invariant that must always hold",
    "slow: takes more than a second",
]

[tool.coverage.report]
# 90% is required on the calculation modules only — that is where a silent
# error is expensive. Reading files and formatting output are covered by the
# end-to-end test and that is enough.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandera.*", "polars.*"]
ignore_missing_imports = true
