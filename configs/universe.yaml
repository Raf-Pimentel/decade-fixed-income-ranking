# Which funds compete.
#
# Every number here was measured against the real CVM files on 2026-08-19,
# not assumed. See docs/01-solution-design.md section 2.
#
# Decade has not yet confirmed the exact definition of "fixed income".
# When they answer, this file is the only thing that changes.

reference_date: 2025-12-31
lookback_months: 12          # scoring window. See decision D-004.
report_windows: [3, 6, 12, 24]   # also reported, for transparency

filters:
  classification: ["Renda Fixa"]   # CVM field `Classificacao`
  status: ["Em Funcionamento Normal"]
  condominium: ["Aberto"]          # closed funds accept no new money
  exclude_exclusive: true          # single-owner funds
  min_net_assets_brl: 10_000_000
  # Raised from 10 to 500 after the first real ranking came back holding funds
  # with 17, 31 and 70 shareholders and tens of billions in assets. Those are
  # master and institutional vehicles labelled "Público Geral", not products a
  # retail investor can buy, and Decade asked for recommendations that are
  # actionable for retail.
  #
  # Measured across the retail universe: the 10th percentile holds 31
  # shareholders and the median 924. Funds with fewer than a hundred declare a
  # zero admin fee 22% of the time, against 6% everywhere else, the same
  # institutional vehicles, disclosing least. A cut at 500 keeps 59% of the
  # universe and sits above the band where those two artefacts live.
  min_shareholders: 500
  min_observations: 200            # business days of quota in the window
  require_fee_and_redemption: true # decision D-013: no recommendation without a price tag
  # Operational cash-zeroing vehicles, not products a client buys. Decade
  # confirmed a "zeragem" fund sat outside the universe they evaluate. Cut the
  # same way an exclusive fund is. See decision D-052.
  exclude_name_markers: ["ZERAGEM"]

# The administration fee carries the heaviest weight of any criterion, and for
# feeder classes the declared value is not what the client pays. It is measured
# instead, against the fund the class actually holds.
fees:
  # How much of a class's fund holdings must sit in one fund before the gap
  # between the two quota series can be read as a fee and nothing else. Below
  # this the class is allocating between funds, and the gap would carry that
  # allocation too. At 0.95 the residual is at most a twentieth of the series,
  # which is smaller than the errors being corrected: measured on the delivered
  # ranking, the declared fee was wrong by a factor of 11 to 45.
  min_master_share: 0.95
  # Shared history a pair needs before its fee is believed. Sixty business days
  # is the same floor the duplicate rule uses.
  min_overlap_days: 60

data_quality:
  max_quarantined_share: 0.05      # above this the pipeline stops
  stale_quota_days: 10             # same quota for longer than this => out
  implausible_daily_move: 0.20     # flagged, NOT dropped: may be amortisation

# Peer groups. Funds are compared only against similar funds, so that the
# ranking does not automatically reward whoever took the most credit risk.
#
# The benchmark is the CDI, for every group, and the output says so group by
# group rather than leaving the reader to assume it. The alternative, IMA-B
# for inflation-linked funds and IRF-M for fixed-rate ones, is the textbook
# answer and is not available: ANBIMA publishes the IMA series as a snapshot
# of the current day, not as history, so a window ending on a past date cannot
# be reconstructed from it. Comparing within the peer group absorbs most of
# the cost, because a benchmark shift moves every fund in a group by the same
# amount and the ranking on excess return is unchanged. It does not absorb all
# of it: return per unit of risk divides that shifted difference by
# volatilities that differ, and there the order does move. The delivery names
# the affected share of the universe.
peer_groups:
  field: Classificacao_Anbima
  min_size: 20                     # smaller groups merge into the parent

# Expected funnel. This is the data regression test (decision D-015).
# A run that deviates beyond the tolerance stops and asks for investigation.
expected_funnel:
  tolerance: 0.03
  steps:
    # Restated on 2026-08-20, after the pipeline reproduced the funnel against
    # the full CVM files. Six of the nine steps matched the original Phase 1
    # measurement exactly; three did not, for reasons worth writing down rather
    # than smoothing over.
    #
    # The Phase 1 numbers were measured by an exploratory script that used one
    # month of daily data and a 20-observation floor. The pipeline applies the
    # 200-observation rule this file has always declared, over twelve months.
    # So the two are not the same quantity, and where they differ the weaker
    # measurement was the reconnaissance one, not the pipeline.
    #
    # Steps unchanged from the independent Phase 1 measurement:
    registered_classes: 36_594          # was 36_598: 4 class ids repeat in the file
    fixed_income: 7_759
    operating: 7_337
    open_ended: 6_580
    non_exclusive: 3_498
    with_quota_series: 3_270            # 3_268 measured; +2 is a December edge
    # Steps restated because the definition changed, not the data:
    with_enough_observations: 2_924     # new step: the 200-day floor, never measured before
    above_min_assets: 2_690             # was 2_944, measured before the 200-day floor
    above_min_shareholders: 787         # was 1_714 at a 10-shareholder cut; see min_shareholders
    # 514, restated on 2026-08-24 and the second time this step has moved.
    #
    # It reached 580 when the statement began to be fetched for every year the
    # window touches rather than only the reference year: a fund that filed in
    # 2024 and never refiled is in force in 2025, and fetching one year made it
    # look as though it had never disclosed anything.
    #
    # It fell to 514 when the fee stopped being taken from the filed field for
    # classes that invest through other funds. That field turned out not to be
    # the price the client pays: four classes in the previous top five filed
    # 0.040% while charging between 0.45% and 1.81%. The fee is now measured
    # against the fund each class holds, and a class whose fee cannot be
    # measured is treated as not having disclosed one, which is exactly what
    # this step has always removed. The 66 classes that left are feeders whose
    # master could not be identified. See D-047.
    #
    # The guardrail fired on this change, at -11.38%, which is what it is for.
    # The number below is restated because the definition changed, not because
    # the tolerance was inconvenient.
    with_fee_and_redemption: 514
    # 472. The last step is the only one that asks about the holder rather than
    # about the fund: a class with no individual and no distributor among its
    # shareholders is not a product a person buys, whatever its regulation
    # permits. Forty-two classes leave here, and four of them had reached the
    # published top five. The rule has no threshold, so there is nothing in it
    # that could be tuned towards a result. See D-050.
    reachable_by_individuals: 472
  by_target_investor:
    retail: 455      # was 496 before the holder mix was read
    qualified: 17    # unchanged: none of the 42 removed were qualified-only
