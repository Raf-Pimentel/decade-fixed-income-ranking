# What "best" means, per client profile.
#
# The split follows the CVM's own `Publico_Alvo` field, because that is what
# legally determines which funds a client may buy. See decision D-010.
#
# Weights are judgement, not derived. That is exactly why the robustness
# simulation exists: `jitter` below is how much each weight is allowed to move
# when we test whether the Top 5 survives a different opinion. See D-011.

metrics:
  # direction: "high" = higher is better, "low" = lower is better
  excess_return:      {direction: high, label: "Gain over the benchmark"}
  return_per_risk:    {direction: high, label: "Return per unit of risk"}
  volatility:         {direction: low,  label: "Day-to-day swing"}
  max_drawdown:       {direction: low,  label: "Worst fall"}
  negative_days:      {direction: low,  label: "Share of losing days"}
  admin_fee:          {direction: low,  label: "Annual cost"}
  redemption_days:    {direction: low,  label: "Days until the money arrives"}
  size:               {direction: high, label: "Assets and shareholders"}
  flow_stability:     {direction: high, label: "Not bleeding redemptions"}

profiles:

  # Two profiles, both retail, separated by when the client needs the money
  # back. See decision D-032: 58% of the retail universe redeems at D+0, so a
  # single retail ranking would hand the same five funds to someone who needs
  # the money tomorrow and to someone investing for three years.
  #
  # The universes overlap on purpose. Someone with a long horizon can happily
  # buy a same-day fund — spare liquidity is not a defect — so the horizon
  # profile is the wider one. The same fund appearing in both lists is the
  # right answer, not a duplication.

  varejo_liquidez:
    label: "Retail — emergency reserve"
    description: >
      Money that may be needed at any moment. Capital preservation and cost
      dominate; return is a secondary criterion.
    eligibility:
      target_investor: ["Público Geral"]
      max_minimum_investment_brl: 5_000
      max_redemption_days: 1
    weights:            # must sum to 100
      admin_fee:        30    # D-012: the only number we know for sure about 2026
      volatility:       20
      max_drawdown:     15
      size:             15
      excess_return:    10
      redemption_days:  10
    jitter:             # +/- range explored in the robustness simulation
      admin_fee:        5
      volatility:       5
      max_drawdown:     3
      size:             3
      excess_return:    3
      redemption_days:  3

  varejo_prazo:
    label: "Retail — two years or more"
    description: >
      Money with a horizon. Risk-adjusted return matters properly here, but
      cost still carries the single largest weight. Every fund the liquidity
      profile can reach, plus everything up to D+30.
    eligibility:
      target_investor: ["Público Geral"]
      max_minimum_investment_brl: 50_000
      max_redemption_days: 30
    weights:
      admin_fee:        25
      excess_return:    20
      return_per_risk:  20
      max_drawdown:     15
      size:             15
      redemption_days:   5
    jitter:
      admin_fee:        5
      excess_return:    5
      return_per_risk:  5
      max_drawdown:     3
      size:             3
      redemption_days:  3

  # Not delivered: funds restricted to qualified investors. Only 79 of the 278
  # eligible ones publish fees and redemption terms — 28%, against 64% for
  # retail — because the duty to publish a factsheet reaches retail funds and
  # not restricted ones. Ranking that sample would produce a list biased by
  # regulation rather than by quality. See D-032. Re-enabling it is a matter of
  # adding a profile block here; the eligibility machinery already supports it.

# How percentiles become one number.
scoring:
  # Winsorising before ranking: one fund with a mis-stated quota should not
  # define the top of the scale for everybody else. Clipping rather than
  # dropping keeps that fund in the ranking, where it can be seen.
  winsorise: {lower: 0.01, upper: 0.99}
  # A metric has to separate funds before a weight attached to it means
  # anything. Below this share of funds sitting off the single most common
  # value, the metric is treated as inert: its weight is redistributed across
  # the metrics that do vary, and the output names it. Eligibility and scoring
  # ask different questions, and a criterion that has already been enforced as
  # a filter can arrive at the scoring step with nothing left to say.
  min_dispersion: 0.05

# How five funds are chosen, rather than five scores.
#
# One manager routinely sells one portfolio through a row of distribution
# wrappers — Caixa offers a dozen over a single fixed-income portfolio. Each is
# a separate class in the registry, each is eligible, and each scores almost
# the same. A top five holding two of them offers four exposures and does not
# say so.
selection:
  # Two funds count as one when the same manager runs both AND the difference
  # between their daily returns barely moves. Measured as the annualised
  # volatility of that difference: two wrappers of one portfolio differ only by
  # a fee, which is a constant drag and adds no variance. Measured on this
  # universe, the two known Itaú twins sit at 0.062% and the tightest pairs at
  # 0.0001%, so a tenth of a percent a year catches them with room to spare.
  #
  # Correlation cannot do this job here and is deliberately not used: every
  # post-fixed fund tracks the same overnight curve and correlates above 0.99
  # with every other, so any threshold meaningful enough to catch a twin also
  # marks half the universe as duplicated.
  max_tracking_difference: 0.001   # 0.10% a.a.
  min_overlap_days: 60             # below this, two series have not met enough

# How we test whether the ranking is real or noise (decision D-011).
robustness:
  simulations: 1000
  seed: 20250101          # fixed, so runs are reproducible
  block_size_days: 21     # resample returns in ~monthly blocks
  top_n: 5
  # Fees and redemption terms do not vary between simulations. That inflates
  # apparent stability, so the report separates metrics that move from metrics
  # that do not. Do not remove this note.
  report_split_by_variability: true

# The past test (Phase 5.5, decision D-017).
# FROZEN BEFORE RUNNING. Rule 11 in CLAUDE.md forbids changing any of this
# after seeing the result.
backtest:
  cut_dates: ["2025-03-31", "2025-06-30", "2025-09-30"]
  random_portfolios: 1000
  seed: 20250630
  success_percentile: 60      # must beat this share of random portfolios
  success_min_dates: 2        # in at least 2 of the 3 cut dates
  discontinued_fund_policy: carry_last_value   # and flag it in the report
