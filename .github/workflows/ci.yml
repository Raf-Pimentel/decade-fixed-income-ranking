name: CI

# Proves the claim the case actually cares about: reproducible from a clean
# environment. Every job below starts from a blank runner that has never seen
# this project.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install the project from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest --cov=src/ranking --cov-report=term-missing

  docker:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker is not installed on the development machine, so this job is
      # what actually verifies the image is real rather than decorative.
      - name: Build
        run: docker build -t fixed-income-ranking:ci .

      - name: The CLI answers inside the image
        run: docker run --rm fixed-income-ranking:ci --help
